media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    format: frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        required: true
      - name: description
        label: 摘要（列表页显示的那句话）
        type: text
        required: false
      - name: image
        label: 封面图（可不传）
        type: image
        required: false
      - name: tags
        label: 标签
        type: list
        required: false
      - name: category
        label: 分类
        type: string
        default: 技术
      - name: draft
        label: 草稿（勾上就先不发布）
        type: boolean
        default: false
      - name: lang
        label: 语言
        type: string
        default: zh_CN
      - name: body
        label: 正文
        type: rich-text

  - name: about
    label: 关于页
    type: file
    path: src/content/spec/about.md
    fields:
      - name: body
        label: 内容
        type: rich-text

  - name: settings
    label: 站点设置
    type: file
    path: src/site-settings.json
    fields:
      - name: title
        label: 站点标题（浏览器标签和页头显示）
        type: string
        required: true
      - name: subtitle
        label: 副标题
        type: string
      - name: authorName
        label: 你的名字
        type: string
      - name: authorBio
        label: 简介（头像下面那两行）
        type: text
      - name: avatar
        label: 头像
        type: image
      - name: github
        label: GitHub 主页地址
        type: string
      - name: email
        label: 邮箱（填了会出现在头像下方）
        type: string
